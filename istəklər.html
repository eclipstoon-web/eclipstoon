<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstək Seriyalar - Eclipstoon</title>
    <link rel="icon" href="logo.webp" type="image/webp">
    <style>
        :root {
            --bg-color: #0c0a1d;
            --sidebar-bg: #131026;
            --text-color: #b4b0cd;
            --text-active: #f3f0ff;
            --card-bg: #181432;
            --accent-color: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #db2777);
        }
        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-color); font-family: Arial, sans-serif;
            position: relative; min-height: 100vh; overflow-x: hidden;
        }
        /* Lotos ləçəkləri animasiya effekti */
        .petal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .petal {
            position: absolute; background: radial-gradient(circle, rgba(219,39,119,0.2) 0%, rgba(124,58,237,0.05) 70%);
            border-radius: 50% 0 50% 0; opacity: 0.6; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
        }
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 25px;
            background-color: var(--sidebar-bg); border-bottom: 1px solid rgba(139, 92, 246, 0.15);
            position: relative; z-index: 10;
        }
        .main-content { padding: 30px 20px; max-width: 900px; margin: 0 auto; position: relative; z-index: 10; }
        h2 { color: var(--text-active); }
        p { color: var(--text-color); }
        .back-link { display: inline-block; margin-top: 15px; color: var(--accent-color); text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Lotos ləçəkləri fonu -->
    <div class="petal-bg">
        <div class="petal" style="width: 25px; height: 15px; left: 10%; animation-duration: 12s; animation-delay: 0s;"></div>
        <div class="petal" style="width: 30px; height: 18px; left: 30%; animation-duration: 15s; animation-delay: 2s;"></div>
        <div class="petal" style="width: 20px; height: 12px; left: 55%; animation-duration: 10s; animation-delay: 4s;"></div>
        <div class="petal" style="width: 35px; height: 20px; left: 75%; animation-duration: 14s; animation-delay: 1s;"></div>
        <div class="petal" style="width: 22px; height: 14px; left: 90%; animation-duration: 11s; animation-delay: 3s;"></div>
    </div>

    <div class="top-navbar">
        <div class="nav-left"></div>
    </div>
    <div class="main-content">
        <h2>⭐ İstək Seriyalar</h2>
        <p>Tərcümə olunmasını istədiyiniz seriyaları burdan bildirə bilərsiniz. (Tezliklə aktivləşəcək)</p>
        <a href="index.html" class="back-link">← Ana səhifəyə qayıt</a>
    </div>
</body>
</html>

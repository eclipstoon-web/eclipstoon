<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitabxanam - Eclipstoon</title>
    <link rel="icon" href="logo_2.webp" type="image/webp">
    <style>
        :root {
            --bg-color: #0d0f18;
            --sidebar-bg: #131726;
            --text-color: #94a3b8;
            --text-active: #f8fafc;
            --card-bg: #161b2e;
            --accent-color: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #a855f7, #6366f1);
        }
        body { margin: 0; padding: 0; background: var(--bg-color); color: var(--text-color); font-family: Arial, sans-serif; }
        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: var(--sidebar-bg); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .header-logo { max-width: 45px; border-radius: 50%; }
        .main-content { padding: 20px; max-width: 900px; margin: 0 auto; }
        h2 { color: var(--text-active); }
        p { color: var(--text-color); }
        .back-link { display: inline-block; margin-top: 15px; color: var(--accent-color); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-navbar">
        <div class="nav-left">
            <a href="index.html"><img src="logo_2.webp" alt="Eclipstoon" class="header-logo"></a>
        </div>
    </div>
    <div class="main-content">
        <h2>Kitabxanam (Seçilmişlər)</h2>
        <p>Bura sizin izlədiyiniz və əlavə etdiyiniz seçilmiş seriyaların siyahısıdır. (Tezliklə aktivləşəcək)</p>
        <a href="index.html" class="back-link">← Ana səhifəyə qayıt</a>
    </div>
</body>
</html>
